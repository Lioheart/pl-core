name: Release Creation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing versioned release tag to rebuild, for example v14.364
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out released version
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - name: Detect Foundry release channel
        id: detect_release
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            v13*)
              STATIC_TAG="foundry-v13"
              ;;
            v14*)
              STATIC_TAG="foundry-v14"
              ;;
            *)
              echo "ERROR: release tag must start with v13 or v14."
              echo "Received release tag: $RELEASE_TAG"
              exit 1
              ;;
          esac

          echo "static_tag=$STATIC_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify target releases exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_TAG: ${{ steps.detect_release.outputs.static_tag }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            > /dev/null

          gh release view "$STATIC_TAG" \
            --repo "$REPOSITORY" \
            > /dev/null

      - name: Populate versioned keys in manifest
        shell: bash
        env:
          STATIC_TAG: ${{ steps.detect_release.outputs.static_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          jq \
            --arg version "$VERSION" \
            --arg url "https://github.com/$REPOSITORY" \
            --arg manifest "https://github.com/$REPOSITORY/releases/download/$STATIC_TAG/module.json" \
            --arg download "https://github.com/$REPOSITORY/releases/download/$STATIC_TAG/module.zip" \
            '.version = $version
             | .url = $url
             | .manifest = $manifest
             | .download = $download' \
            module.json > module.tmp.json

          mv module.tmp.json module.json

      - name: Flatten tours/pl directory
        shell: bash
        run: |
          if [ -d "tours/pl" ]; then
            find tours/pl -mindepth 1 -maxdepth 1 -exec mv -t tours/ -- {} +
            rmdir tours/pl
          fi

      - name: Create module archive
        shell: bash
        run: |
          zip --recurse-paths ./module.zip \
            module.json lang/ scripts/ styles/ tours/

      - name: Upload files to versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            module.json \
            module.zip \
            --repo "$REPOSITORY" \
            --clobber

      - name: Update static Foundry release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_TAG: ${{ steps.detect_release.outputs.static_tag }}
        run: |
          gh release upload "$STATIC_TAG" \
            module.json \
            module.zip \
            --repo "$REPOSITORY" \
            --clobber
