name: Release Creation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild, for example v14.364
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Populate Versioned keys in Manifest
        run: |
          VERSION="${RELEASE_TAG#v}"

          jq \
            --arg version "$VERSION" \
            --arg url "https://github.com/$REPOSITORY" \
            --arg manifest "https://github.com/$REPOSITORY/releases/latest/download/module.json" \
            --arg download "https://github.com/$REPOSITORY/releases/latest/download/module.zip" \
            '.version = $version
             | .url = $url
             | .manifest = $manifest
             | .download = $download' \
            module.json > module.tmp.json

          mv module.tmp.json module.json

      - name: Create Module Archive
        run: |
          rm -f module.zip

          zip --recurse-paths ./module.zip \
            module.json babele-register.js src/ lang/ styles/ static/

      - name: Upload Files to Published Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            module.json \
            module.zip \
            --repo "$REPOSITORY" \
            --clobber
