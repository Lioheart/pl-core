name: Release Creation

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Detect FVTT release channel
        id: detect_channel
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"

          if [[ "$TAG" == v13* ]]; then
            echo "channel=v13" >> "$GITHUB_OUTPUT"
            echo "static_tag=foundry-v13" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == v14* ]]; then
            echo "channel=v14" >> "$GITHUB_OUTPUT"
            echo "static_tag=foundry-v14" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: tag must start with v13 or v14"
            exit 1
          fi

      - name: Populate Versioned keys in Manifest
        uses: microsoft/variable-substitution@v1
        with:
          files: 'module.json'
        env:
          version: ${{ github.event.release.tag_name }}
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/download/${{ steps.detect_channel.outputs.static_tag }}/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ steps.detect_channel.outputs.static_tag }}/module.zip

      - name: Flatten tours/pl directory
        shell: bash
        run: |
          if [ -d "tours/pl" ]; then
            mv tours/pl/* tours/ || true
            rm -rf tours/pl
          fi

      - name: Create Module Archive
        shell: bash
        run: |
          zip --recurse-paths ./module.zip \
            module.json lang/ scripts/ styles/ tours/

      - name: Update Static Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: Release ${{ steps.detect_channel.outputs.channel }}
          tag: ${{ steps.detect_channel.outputs.static_tag }}
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./module.json, ./module.zip"
          makeLatest: true
          body: "Last updated by release ${{ github.event.release.tag_name }}"
