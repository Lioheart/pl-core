name: Release Creation

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # Wykrywamy wersję główną (v13/v14), która posłuży jako stały tag w URL-ach
      - name: Detect FVTT branch
        id: detect_branch
        run: |
          TAG="${{ github.event.release.tag_name }}"

          if [[ "$TAG" == v13* ]]; then
            echo "branch=v13" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == v14* ]]; then
            echo "branch=v14" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: tag must start with v13 or v14"
            exit 1
          fi

      # Używamy identyfikatora brancha (v13 lub v14) w linkach zamiast zmiennego tagu
      - name: Populate Versioned keys in Manifest
        id: sub_manifest
        uses: microsoft/variable-substitution@v1
        with:
          files: 'module.json'
        env:
          version: ${{ github.event.release.tag_name }}
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/download/${{ steps.detect_branch.outputs.branch }}/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ steps.detect_branch.outputs.branch }}/module.zip

      - name: Flatten tours/pl directory
        run: |
          if [ -d "tours/pl" ]; then
            mv tours/pl/* tours/ || true
            rm -rf tours/pl
          fi

      - name: Create Module Archive
        run: |
          zip --recurse-paths ./module.zip \
            module.json lang/ scripts/ styles/ tours/

      # Publikujemy pliki pod stałym tagiem (v13 lub v14), nadpisując poprzednie.
      - name: Update Static Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: Release ${{ steps.detect_branch.outputs.branch }}
          tag: ${{ steps.detect_branch.outputs.branch }}
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./module.json, ./module.zip"
          makeLatest: true
          body: "Last updated by release ${{ github.event.release.tag_name }}"
